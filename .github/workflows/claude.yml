name: Claude

# Claude on the Max subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`), never an API key.
# - review: every non-draft PR, on open and on each push (pushes straight to master are reviewed
#   locally by tools/git-hooks/pre-push instead).
# - mention: `@claude …` in a PR/issue comment, from someone with write access (the action checks).
# Fork PRs are skipped by the action itself; secrets never reach them.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name == 'pull_request' && 'review' || 'mention' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an adversarial reviewer of this pull request. Read CLAUDE.md and the
            .claude/rules/*.md files for the areas the diff touches before judging it.

            Report only real correctness bugs, regressions, races, leaks, crashes, security
            problems (this repo is public: secrets, personal data, shell/AppleScript injection)
            and violations of CLAUDE.md or .claude/rules. Verify each against the code first;
            skip style and refactoring opinions.

            Post each finding as an inline comment on the line, with a concrete failure scenario
            and a one-line fix. End with one short summary comment (or "No findings.").
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*)"

  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model opus
