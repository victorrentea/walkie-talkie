<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team chat</title>
<style>
  /* A plain chat composer for the "just dictate" scene: the caret sits in the message box. */
  * { box-sizing: border-box; margin: 0; }
  body { font: 16px/1.45 -apple-system, "Helvetica Neue", sans-serif; color: #1c2330; background: #f4f5f8; display: flex; height: 100vh; }
  nav { width: 230px; background: #2b1d3a; color: #d9cfe6; padding: 22px 18px; font-size: 15px; }
  nav b { display: block; color: #fff; font-size: 19px; margin-bottom: 20px; } nav div { padding: 6px 10px; border-radius: 8px; }
  nav .on { background: #5b3a86; color: #fff; font-weight: 600; }
  main { flex: 1; display: flex; flex-direction: column; padding: 22px 34px; }
  h2 { font-size: 20px; padding-bottom: 14px; border-bottom: 1px solid #dfe2ea; }
  .log { flex: 1; padding-top: 18px; } .msg { display: flex; gap: 12px; margin-bottom: 18px; }
  .who { width: 40px; height: 40px; border-radius: 10px; background: #ffb347; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; }
  .msg b { font-size: 15px; } .msg small { color: #8a90a0; margin-left: 8px; } .msg p { font-size: 17px; }
  textarea { width: 100%; height: 120px; resize: none; border: 2px solid #5b3a86; border-radius: 14px; padding: 16px 18px;
             font: 19px/1.45 -apple-system, sans-serif; outline: none; background: #fff; }
</style>
</head>
<body>
<nav><b>Brewly team</b><div># general</div><div class="on"># releases</div><div># design</div><div># random</div></nav>
<main>
  <h2># releases</h2>
  <div class="log">
    <div class="msg"><div class="who">A</div><div><b>Anna</b><small>10:02</small><p>Morning! Is 2.4 good to go, or do we wait for the checkout fix?</p></div></div>
  </div>
  <textarea id="box" placeholder="Message #releases" autofocus></textarea>
</main>
</body>
</html>
