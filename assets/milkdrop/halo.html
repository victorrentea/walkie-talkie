<!doctype html>
<html>
<meta charset="utf-8">
<title>MilkDrop halo</title>
<!--
  The MilkDrop halo: the real butterchurn engine, the way voice-halo runs it,
  hosted by `MilkDropHalo.swift` in a transparent, click-through WKWebView.

  What this page adds to the engine, and why:

  · A SQUARE canvas, sized by the preset's `scale` — the page's "cover, not
    fit". Rendered non-square, every circle in a preset comes out an oval (the
    preset's coordinates are normalised to the canvas, not the screen); that
    bug cost the page a round trip.
    **The canvas fills the host's view, one canvas pixel per device pixel, and
    nothing scales it afterwards** (2026-09-21). It used to be CSS-`transform:
    scale()`d by the preset's `scale` *on top of* a view whose side the host had
    already multiplied by that same `scale`, and both halves of that were wrong:

    · it asked the compositor to resample a 3220 px canvas into 3000 device px
      on every frame. Measured with a 1-device-pixel grid pushed through the
      real panel, the modulation depth of the finest detail the screen can hold
      was **121 of 255 against 164** at 1:1, and every hairline arrived split
      across two pixels with a phase that drifted along the line. That is what
      *"punctele apar un pic blurate"* was;
    · and it made the halo `max(w, h) × scale²`, so a `scale` ask landed
      **squared** — a *"×1.3"* arrived as ×1.69 — while `ProjectMHalo`, on the
      same `scale`, drew `max(w, h) × scale`. The two engines drew the same
      preset at different sizes and only this one had a dead margin round it.
  · A KEYING pass: butterchurn clears to opaque black. On the page that black
    vanishes under `mix-blend-mode: screen`; over the desktop there is nothing
    to blend with, so a second WebGL canvas samples the engine's canvas and
    emits premultiplied (rgb, max(r,g,b)) — black becomes transparent, light
    stays light. The same key the lightning film was cut with.
  · The page's `fade` (MilkDrop 7): a radial mask, full at the centre, ~50% at
    half the screen, ~10% at its edge and constant beyond — applied in the
    same shader, on an ellipse the size of the SCREEN, not the canvas.
  · Audio comes from the app: `halo.audio(<base64 Float32>)` with the last
    1024 samples at 16 kHz. They are handed to the engine as the byte arrays
    its analyser would have produced (`render({audioLevels})`), so no
    AudioContext ever opens a microphone or an output device here.
  · No engine bundled (`butterchurn.min.js` missing): a test pattern goes
    through the same keying pass, so the host's transparency, sizing and
    audio bridge can be checked without it.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent !important; }
  #out { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; }
</style>
<body>
<canvas id="out"></canvas>
<script src="butterchurn.min.js"></script>
<script src="butterchurnPresets.min.js"></script>
<script src="butterchurnPresetsExtra.min.js"></script>
<script>
(function () {
  'use strict';
  const out = document.getElementById('out');
  const src = document.createElement('canvas');          // the engine's own canvas, never shown
  let side = 0, dpr = 1, running = false, viz = null, presets = null;
  let fade = false, fadeRx = 1, fadeRy = 1, screenW = 1, screenH = 1, testMode = false;
  // Rata pe care butterchurn crede ca o au esantioanele din `timeByteArray` —
  // rata AudioContext-ului lui, fiindca acolo isi ia FFT-ul cand il lasi sa-si
  // traga singur sunetul (`connectAudio`). Vezi `audio(b64)`.
  let engineRate = 48000;
  const HOST_RATE = 16000;   // MicRecorder / DemoVoice; see `audio(b64)`
  const audio = { time: new Uint8Array(1024), l: new Uint8Array(1024), r: new Uint8Array(1024), fresh: false };
  audio.time.fill(128); audio.l.fill(128); audio.r.fill(128);

  // ---- the keying pass ----------------------------------------------------
  const gl = out.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
  let prog = null, tex = null, uFade = null, uRadii = null, uRes = null, uFloor = null, uGain = null;
  let freshWave = 1;
let fadeFloor = 0.10, gain = 1, rotX = 1, fadeStart = 0, uStart = null, pinCenter = false;
  function compile(type, code) {
    const sh = gl.createShader(type); gl.shaderSource(sh, code); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  function setupGL() {
    const vs = compile(gl.VERTEX_SHADER, `attribute vec2 p; varying vec2 uv;
      void main() { uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`);
    const fs = compile(gl.FRAGMENT_SHADER, `precision mediump float; varying vec2 uv;
      uniform sampler2D t; uniform float fade; uniform vec2 radii; uniform vec2 res; uniform float floorA; uniform float gain; uniform float fadeStart;
      // the page's mask: stops 0→1, .28→.78, .5→.5, .75→.26, 1→floor, constant past 1.
      // floorA is what is left past the fade radius: the page's 0.10, or 0 for a
      // preset that has to be gone entirely at that distance (Tunnel, 2026-09-20).
      // fadeStart > 0: full light out to that fraction of the radius, then one
      // smooth fall to floorA at the edge — for a preset that has to stay
      // visible across its canvas (Tunnel: "2x more visible", 2026-09-20)
      float mask(float d) {
        if (fadeStart > 0.0) return d <= fadeStart ? 1.0 : mix(1.0, floorA, smoothstep(fadeStart, 1.0, d));
        if (d <= 0.28) return mix(1.0, 0.78, d / 0.28);
        if (d <= 0.50) return mix(0.78, 0.50, (d - 0.28) / 0.22);
        if (d <= 0.75) return mix(0.50, 0.26, (d - 0.50) / 0.25);
        if (d <= 1.00) return mix(0.26, floorA, (d - 0.75) / 0.25);
        return floorA;
      }
      void main() {
        vec4 c = texture2D(t, vec2(uv.x, 1.0 - uv.y));
        c.rgb = min(c.rgb * gain, 1.0);          // gain > 1: the preset more opaque and more intense
        float a = max(c.r, max(c.g, c.b));
        if (fade > 0.5) {
          vec2 q = (uv - 0.5) * res / radii;      // 1 = the fade radius
          a *= mask(length(q));
          c.rgb *= mask(length(q));
        }
        gl_FragColor = vec4(c.rgb, a);           // premultiplied: every channel <= a by construction
      }`);
    prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    uFade = gl.getUniformLocation(prog, 'fade'); uRadii = gl.getUniformLocation(prog, 'radii'); uRes = gl.getUniformLocation(prog, 'res');
    uFloor = gl.getUniformLocation(prog, 'floorA'); uGain = gl.getUniformLocation(prog, 'gain'); uStart = gl.getUniformLocation(prog, 'fadeStart');
    gl.disable(gl.BLEND);
  }
  function key() {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    gl.viewport(0, 0, out.width, out.height);
    gl.uniform1f(uFade, fade ? 1 : 0);
    gl.uniform2f(uRadii, fadeRx, fadeRy);
    gl.uniform2f(uRes, side, side);
    gl.uniform1f(uFloor, fadeFloor);
    gl.uniform1f(uGain, gain);
    gl.uniform1f(uStart, fadeStart);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // ---- the test pattern, when there is no engine ---------------------------
  let t0 = performance.now();
  function testFrame() {
    const c = src.getContext('2d'), px = src.width, t = (performance.now() - t0) / 1000;
    c.fillStyle = '#000'; c.fillRect(0, 0, px, px);
    let loud = 0; for (let i = 0; i < 1024; i += 8) loud = Math.max(loud, Math.abs(audio.time[i] - 128) / 128);
    for (let k = 0; k < 4; k++) {
      const r = px * (0.12 + 0.09 * k) * (1 + 0.5 * loud);
      c.strokeStyle = `hsl(${(t * 40 + k * 70) % 360}, 90%, 60%)`; c.lineWidth = px * 0.01;
      c.beginPath(); c.arc(px / 2 + Math.cos(t + k) * px * 0.05, px / 2 + Math.sin(t * 1.3 + k) * px * 0.05, r, 0, 6.2832); c.stroke();
    }
  }

  // ---- the loop -------------------------------------------------------------
  // Plafonul de cadre al gazdei (halo.fps): pe baterie fiecare cadru costă CPU,
  // iar presetele sunt scrise în timp (`time`, `fps`), nu în număr de cadre.
  let speed = 1;
  let lastFrameAt = 0, frameInterval = 0, lastRenderAt = 0;
  function frame(now) {
    if (!running) return;
    if (frameInterval && now - lastFrameAt < frameInterval - 2) { requestAnimationFrame(frame); return; }
    lastFrameAt = now;
    if (viz) {
      // `speed`: presetele sunt scrise in timp, deci singurul mod de a le incetini
      // este sa le minti despre cat a trecut. `render({elapsedTime})` e chiar
      // parametrul motorului (`calcTimeAndFPS`), nu un hack al nostru: la
      // speed = 0.6 secunda presetului trece in 1.67 s de-ale noastre, la aceeasi
      // rata de cadre — deci mai lent, nu mai sacadat (plafonul de cadre de mai
      // sus face exact invers si de-aia nu el e knob-ul).
      // Primul cadru n-are delta; ii dam pasul nominal, nu zero.
      let dt = lastRenderAt ? (now - lastRenderAt) / 1000 : (frameInterval ? frameInterval / 1000 : 1 / 60);
      lastRenderAt = now;
      // O fila care a stat in fundal poate intoarce un delta de secunde; presetul
      // ar sari. Plafon la 4 pasi nominali.
      dt = Math.min(dt, 4 * (frameInterval ? frameInterval / 1000 : 1 / 60));
      viz.render({ audioLevels: { timeByteArray: audio.time, timeByteArrayL: audio.l, timeByteArrayR: audio.r },
                   elapsedTime: dt * speed });
    } else if (testMode) {
      testFrame();
    }
    key();
    requestAnimationFrame(frame);
  }

  // ---- the API the host calls ---------------------------------------------
  window.halo = {
    // side: CSS px of the square (the host has already applied the preset's
    // `scale` to it); r: canvas pixels per point, the preset's `renderScale`
    // or the backing scale; d: the display's backing scale, for the record;
    // screen: {w, h} for the fade ellipse
    size(s, r, d, screen) {
      side = s; dpr = d;
      // **The canvas fills the host's view**, at `r` pixels per point — the
      // display's backing scale for every preset but Sparks, which asks for
      // half of it (`HaloStyle.Preset.renderScale`, and the reason is there).
      // It is never CSS-scaled: the host has already multiplied the preset's
      // `scale` into the view it hands us, and scaling it a second time here is
      // what both of 2026-09-21's faults were — see the note at the top.
      out.style.width = out.style.height = s + 'px';
      out.width = out.height = Math.round(s * r);
      src.width = src.height = Math.round(s * r);
      screenW = screen.w; screenH = screen.h; fadeRx = screen.w / 2; fadeRy = screen.h / 2;
      if (!prog) setupGL();
      if (viz) viz.setRendererSize(src.width, src.height);
      return s + 'pt canvas, ' + out.width + 'px' + (r === d ? '' : ' (' + r + 'px/pt, screen is ' + d + ')');
    },
    // opts (2026-09-20, Victor on Tunnel: *"de 2x mai opac/intens … fade out complet
    // la o distanță de 1/2 din width ecran"*, and 2× the rotation):
    //   fadeRadius: the fade's radius as a fraction of the SCREEN WIDTH, same in
    //               both axes (default: the page's ellipse, half the screen each way)
    //   fadeFloor:  what remains past the radius (page: 0.10; 0 = gone entirely)
    //   gain:       colour multiplier before keying (2 = twice as opaque/intense)
    //   freshWave:  the newest frame's wave_a scaled by this, with `decay` moved
    //               so the pile it feeds keeps its brightness (1-decay takes the
    //               same factor). See HaloStyle.Preset.freshWave.
    //   rot:        multiplier on the preset's per-frame rotation, applied by
    //               appending to its compiled frame equations — our copy of the
    //               preset, the vendored pack untouched
    preset(name, wantFade, opts) {
      opts = opts || {};
      fade = !!wantFade;
      fadeFloor = opts.fadeFloor === undefined ? 0.10 : opts.fadeFloor;
      gain = opts.gain || 1;
      fadeStart = opts.fadeStart || 0;
      rotX = opts.rot || 1;
      freshWave = opts.freshWave === undefined ? 1 : opts.freshWave;
      pinCenter = !!opts.pinCenter;
      //   speed:      how fast the preset's own clock runs, 1 = real time. See
      //               the frame loop for why this and not the frame cap.
      speed = opts.speed || 1;
      lastRenderAt = 0;
      //   fadeAtEdge: the fade reaches the CANVAS edge (radius = half the canvas side),
      //               so a scaled-down preset dies out before its square can show —
      //               Victor, 2026-09-20: *"it still renders effects with a square crop"*
      if (opts.fadeAtEdge) { fadeRx = fadeRy = side / 2; }
      else if (opts.fadeRadius) { fadeRx = fadeRy = screenW * opts.fadeRadius; }
      else { fadeRx = screenW / 2; fadeRy = screenH / 2; }
      if (!window.butterchurn) { testMode = true; return 'no engine — test pattern'; }
      if (!presets) {
        presets = Object.assign({}, butterchurnPresets.getPresets(),
          (window.butterchurnPresetsExtra || { getPresets: () => ({}) }).getPresets());
      }
      if (!viz) {
        // A context is required by the constructor; it is never resumed and
        // nothing is connected to it, so no device is ever opened.
        const actx = new (window.AudioContext || window.webkitAudioContext)();
        engineRate = actx.sampleRate || 48000;
        viz = (butterchurn.default || butterchurn).createVisualizer(actx, src,
                { width: src.width, height: src.height, pixelRatio: 1 });
        viz.setRendererSize(src.width, src.height);
      }
      if (!presets[name]) return 'no such preset: ' + name;
      let p = presets[name], note = '';
      if (rotX !== 1 || pinCenter || freshWave !== 1) {
        // our copy: the frame equations are butterchurn's compiled JS over `a`;
        // whatever is appended runs after them every frame. `a.rot*=k` doubles
        // the whole per-frame turn, sine terms included; `a.cx=a.cy=.5` pins a
        // centre the preset wanders (Tunnel, Cauldron: ±0.11 of sines on cx/cy)
        // to the canvas middle, which is what sits on the pointer.
        p = JSON.parse(JSON.stringify(p));
        // freshWave: the preset's own decay is the one to keep constant against,
        // so it is read off the preset rather than assumed; with none there is
        // nothing to hold steady and the amendment is skipped, as in pmhalo.
        const d0 = p.baseVals && typeof p.baseVals.decay === 'number' ? p.baseVals.decay : null;
        const wave = freshWave !== 1 && d0 !== null
          ? 'a.wave_a=a.wave_a*' + freshWave + ';a.decay=' + (1 - (1 - d0) * freshWave) + ';' : '';
        p.frame_eqs_str = (p.frame_eqs_str || '') + ';'
          + (rotX !== 1 ? 'a.rot=a.rot*' + rotX + ';' : '')
          + (pinCenter ? 'a.cx=0.5;a.cy=0.5;' : '') + wave;
        note = (rotX !== 1 ? ' rot ×' + rotX : '') + (pinCenter ? ' centre pinned' : '')
             + (wave ? ' fresh wave ×' + freshWave : '');
      }
      viz.loadPreset(p, 0.6);
      return 'ok' + (note ? ' (' + note.trim() + ')' : '');
    },
    // b64: Float32 little-endian, the last N samples in −1…1, at `HOST_RATE`.
    //
    // **Esantioanele se reesantioneaza la rata motorului, si asta nu e o
    // finete** (2026-09-21). butterchurn isi imparte binurile de FFT in
    // bass/mid/treb dupa indici ficsi peste cele 1024 de valori, presupunand ca
    // sunt la rata AudioContext-ului sau — asa cum sunt cand isi trage singur
    // sunetul prin `connectAudio`, cum face pagina publicata
    // (victorrentea.github.io/voice-halo, care apeleaza `render()` gol).
    // Microfonul relayului inregistreaza la 16 kHz, deci 1024 de esantioane
    // brute sunt 64 ms de sunet turnate intr-un tablou pe care motorul il crede
    // de 21 ms: **tot spectrul aterizeaza cu un factor de 3 mai jos**, vorbirea
    // citeste ca bas, iar detectia de bataie — de care atarna `q27` al
    // mozaicului, adica insusi pasul retelei de placi — nu mai porneste la fel.
    // De aici *"nici nu are toate fazele acelei animatii de pe net"*.
    //
    // Deci luam exact atatea esantioane cat inseamna 1024 la rata motorului
    // (341 la 16 kHz contra 48 kHz) si le interpolam liniar pana la 1024. Nu e
    // un filtru de reesantionare cumsecade — pentru o fereastra de forma de unda
    // pe care motorul o trece prin propriul FFT, liniara e destul, si pastreaza
    // frecventele acolo unde le asteapta el.
    audio(b64) {
      const bin = atob(b64), n = bin.length >> 2, dv = new DataView(new ArrayBuffer(bin.length));
      for (let i = 0; i < bin.length; i++) dv.setUint8(i, bin.charCodeAt(i));
      const ratio = HOST_RATE / engineRate;                 // 16000/48000 = 1/3
      const need = Math.max(2, Math.min(n, Math.round(1024 * ratio)));
      const from = n - need;                                // cele mai noi `need`
      const at = (i) => dv.getFloat32((from + i) * 4, true);
      for (let i = 0; i < 1024; i++) {
        const x = i * (need - 1) / 1023, j = Math.floor(x), f = x - j;
        const v = n >= 2 ? at(j) * (1 - f) + at(Math.min(j + 1, need - 1)) * f : 0;
        const b = Math.max(0, Math.min(255, Math.round(128 + v * 127)));
        audio.time[i] = b; audio.l[i] = b; audio.r[i] = b;
      }
    },
    // One frame rendered and keyed on demand, returned as a PNG data URL — the
    // engine's output with nothing of the screen in it (the native route's
    // `WT_PM_SHOOT` twin, for the side-by-side in docs/projectm/). Read in the
    // same task as the draw, so no preserveDrawingBuffer is needed.
    snapshot() {
      if (viz) viz.render({ audioLevels: { timeByteArray: audio.time, timeByteArrayL: audio.l, timeByteArrayR: audio.r } });
      else if (testMode) testFrame();
      key();
      return out.toDataURL('image/png');
    },
    // The engine's audio statistics this frame — what the presets' `bass`,
    // `mid`, `treb` (+ `_att`) read; for comparing against projectM's on the
    // same samples (`WT_MD_LEVELS=1`).
    levels() {
      const r = viz && (viz.renderer || viz);
      const a = r && r.audioLevels; if (!a) return 'none';
      const au = r.audio || (viz && viz.audio) || {};
      let ss = 0, sm = 0, ws = 0, wm = 0;
      if (au.freqArray) for (const v of au.freqArray) { ss += v; if (v > sm) sm = v; }
      if (au.timeArrayL) for (const v of au.timeArrayL) { ws += Math.abs(v); if (Math.abs(v) > wm) wm = Math.abs(v); }
      // The preset's own frame variables (its beat index is Mosaic's `q27`), for
      // comparing the animation's phase against the native engine's.
      const fv = (r.presetEquationRunner && r.presetEquationRunner.mdVSFrame) || {};
      return JSON.stringify({ frame: r.frameNum, fps: +(r.fps || 0).toFixed(1), time: +(r.time || 0).toFixed(2), q23: fv.q23, q27: fv.q27, q24: fv.q24, q22: +(fv.q22 || 0).toFixed(3),
        bass: +a.bass.toFixed(3), mid: +a.mid.toFixed(3), treb: +a.treb.toFixed(3),
        bass_att: +a.bass_att.toFixed(3), mid_att: +a.mid_att.toFixed(3), treb_att: +a.treb_att.toFixed(3),
        spec_n: au.freqArray ? au.freqArray.length : 0, spec_sum: +ss.toFixed(2), spec_max: +sm.toFixed(3),
        wave_n: au.timeArrayL ? au.timeArrayL.length : 0, wave_abs_mean: au.timeArrayL ? +(ws / au.timeArrayL.length).toFixed(3) : 0, wave_abs_max: +wm.toFixed(3) });
    },
    start() { if (running) return; running = true; lastFrameAt = 0; requestAnimationFrame(frame); },
    fps(n) { frameInterval = n > 0 ? 1000 / n : 0; },
    stop() { running = false; },
    engine() { return !!window.butterchurn; }
  };
})();
</script>
</body>
</html>
